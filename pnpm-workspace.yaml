packages:
  - 'libs/**'

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  nx: true
  unrs-resolver: true

overrides:
  "@anatine/zod-nestjs>zod": "^4.6.5"
  "@anatine/zod-openapi>zod": "^4.6.5"

peerDependencyRules:
  allowedVersions:
    "@nx/vue>vue-tsc": "3"
    "@nx/vue>vue-router": "5"
    "vuepress": "2.0.0-rc.30"
    "@ghentcdh/json-forms-core>zod": "4"
  ignoreMissing:
    - vuepress
